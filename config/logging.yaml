version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
  file:
    class: logging.FileHandler
    level: INFO
    formatter: standard
    filename: "logs/etl.log"  # overridden dynamically in logger.py with a run timestamp
    encoding: utf-8

loggers:
  mercadolibre_etl:
    level: INFO
    handlers: [console, file]
    propagate: false